services:

  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelpay
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: sentinelpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI app ─────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://sentinelpay:changeme@db:5432/sentinelpay
    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
    # Mount source for live reload during development
    volumes:
      - .:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  pgdata:
